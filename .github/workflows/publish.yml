name: Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# All releases share a queue so they cannot select the same next version.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'npm-release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm install --ignore-scripts
      - name: Check committed client bundle
        run: |
          set -euo pipefail
          cp lib/client.js /tmp/client.js.committed
          node scripts/build-client.mjs
          diff -u /tmp/client.js.committed lib/client.js
      - name: Check manifest and syntax
        run: node scripts/check-manifest.mjs
      - name: Select release version
        id: release
        if: ${{ github.event_name != 'pull_request' }}
        run: node scripts/prepare-release.mjs
      - name: Pack and validate
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          mv dist/dsh-hindsight-gui-*.tgz dist/dsh-hindsight-gui.tgz
          mkdir -p /tmp/pkg
          tar -xzf dist/dsh-hindsight-gui.tgz -C /tmp/pkg
          for f in package.json cordis.patch.yml lib/index.js lib/client.js; do
            test -f "/tmp/pkg/package/$f" || { echo "::error::missing $f"; exit 1; }
          done
          if [ -d /tmp/pkg/package/src ] || [ -d /tmp/pkg/package/node_modules ]; then
            echo "::error::tarball contains sources or node_modules"
            exit 1
          fi
          node -e 'const p=require("/tmp/pkg/package/package.json"); if(p.name!=="dsh-hindsight-gui") throw new Error("wrong package")'
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/dsh-hindsight-gui.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: >-
      needs.verify.outputs.should_publish == 'true' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
       (github.event_name == 'workflow_dispatch' && inputs.dry-run != true && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Node 22's bundled npm 10 cannot exchange OIDC credentials.
      - name: Install OIDC-capable npm
        run: |
          npm install --global npm@11
          node --version
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish verified tarball with OIDC
        run: npm publish ./dist/dsh-hindsight-gui.tgz --provenance --access public --tag latest --registry=https://registry.npmjs.org/
      - name: Report release
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: echo "Published dsh-hindsight-gui@$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
