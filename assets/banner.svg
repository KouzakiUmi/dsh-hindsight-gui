<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Hindsight 记忆管理台：记忆与模型，一页看清</title>
  <desc id="desc">产品流程示意，不是截图。五分类设置页通过 Host 同源接口校验并分别保存配置；Host 查询 Hindsight API，服务端配置在下一次受控启动时映射为环境变量。本插件不提供记忆工具，不部署服务，也不接管外部进程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#13263c"/></linearGradient>
    <linearGradient id="stripe" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#14b8a6" stop-opacity=".15"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7b9db7"/></marker>
    <style>
      text{font-family:"Noto Sans SC",system-ui,sans-serif} .kicker{font-size:15px;letter-spacing:3px;fill:#5eead4} .caption{font-size:15px;fill:#91a9bf} .label{font-size:19px;font-weight:650;fill:#e5eef8} .small{font-size:13px;fill:#a4bbcf} .panel{fill:#16283e;stroke:#36516c;stroke-width:1.2} .wire{fill:none;stroke:#7b9db7;stroke-width:1.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="640" rx="24" fill="url(#bg)"/>
  <path d="M0 24Q0 0 24 0H10V640H24Q0 640 0 616Z" fill="url(#stripe)"/>
  <ellipse cx="1245" cy="75" rx="390" ry="290" fill="url(#glow)"/>
  <path d="M775 40V600" stroke="#253c53" stroke-width="1"/>
  <text x="70" y="107" class="kicker">DSH PLUGIN · MEMORY SETTINGS</text>
  <g transform="translate(70 154) scale(2.3)" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14"/><path d="M12 8.5A3 3 0 0 0 6.5 9.8 3 3 0 0 0 7 15.4 2.6 2.6 0 0 0 12 17"/><path d="M12 8.5A3 3 0 0 1 17.5 9.8 3 3 0 0 1 17 15.4 2.6 2.6 0 0 1 12 17"/>
  </g>
  <text x="143" y="199" fill="#f4f8fc" font-size="44" font-weight="750">Hindsight 记忆管理台</text>
  <text x="73" y="266" fill="#d7e6f5" font-size="31" font-weight="600">记忆与模型，一页看清。</text>
  <text x="73" y="313" class="caption">长期记忆设置 · 功能模型路由 · 向量模型 · 服务状态</text>
  <text x="73" y="347" class="caption">不再手改多份配置；先核对，再保存，再受控生效。</text>
  <g transform="translate(72 391)">
    <rect width="80" height="37" rx="18.5" fill="#133b39" stroke="#267e73"/><text x="40" y="25" text-anchor="middle" fill="#5eead4" font-size="14">概览</text>
    <rect x="91" width="123" height="37" rx="18.5" fill="#152b41" stroke="#355574"/><text x="152.5" y="25" text-anchor="middle" fill="#bdcfe1" font-size="14">记忆与连接</text>
    <rect x="225" width="80" height="37" rx="18.5" fill="#152b41" stroke="#355574"/><text x="265" y="25" text-anchor="middle" fill="#bdcfe1" font-size="14">模型</text>
    <rect x="316" width="80" height="37" rx="18.5" fill="#152b41" stroke="#355574"/><text x="356" y="25" text-anchor="middle" fill="#bdcfe1" font-size="14">安全</text>
    <rect x="407" width="80" height="37" rx="18.5" fill="#152b41" stroke="#355574"/><text x="447" y="25" text-anchor="middle" fill="#bdcfe1" font-size="14">高级</text>
  </g>
  <text x="73" y="491" fill="#bfd1e4" font-size="17">一个保存条，保留跨分类草稿。</text>
  <text x="73" y="541" class="small">工具由官方包提供 · API 自行准备 · 外部进程不接管</text>
  <text x="73" y="570" fill="#68839c" font-size="12">dsh-hindsight-gui · DeepSeek Harness 记忆配置与状态面板</text>
  <text x="814" y="107" class="kicker">HOW IT WORKS</text>
  <text x="814" y="136" class="small">配置与生效流程示意 · 非界面截图</text>
  <rect x="814" y="167" width="220" height="83" rx="14" class="panel"/>
  <text x="834" y="199" class="label">设置页</text><text x="834" y="226" class="small">分类切换 · 草稿与统一保存</text>
  <rect x="1088" y="167" width="272" height="83" rx="14" class="panel"/>
  <text x="1108" y="199" class="label">Host 同源接口</text><text x="1108" y="226" class="small">白名单 · 修订校验 · 凭据引用</text>
  <path d="M1034 208H1084" class="wire"/>
  <rect x="814" y="322" width="220" height="83" rx="14" class="panel"/>
  <text x="834" y="354" class="label">Agent / GUI 配置</text><text x="834" y="381" class="small">分别保存 · 保留未知配置键</text>
  <rect x="1088" y="322" width="272" height="83" rx="14" class="panel"/>
  <text x="1108" y="354" class="label">Hindsight API</text><text x="1108" y="381" class="small">健康状态 · 记忆库 · 库防护策略</text>
  <path d="M1140 250V279H924V317" class="wire"/>
  <path d="M1250 250V317" class="wire"/>
  <text x="1262" y="291" fill="#91a9bf" font-size="11">查询 / 策略写入</text>
  <rect x="814" y="470" width="546" height="78" rx="14" fill="#12302f" stroke="#2e776d"/>
  <text x="834" y="500" class="label">服务端模型 / Embedding / 审计参数</text>
  <text x="834" y="526" fill="#8dc9bb" font-size="13">映射为环境变量 · 仅在下一次受控启动时应用</text>
  <path d="M924 405V465" class="wire"/>
  <path d="M1360 510H1387V363H1365" class="wire" stroke-dasharray="5 5"/>
  <text x="814" y="586" fill="#91a9bf" font-size="12">本机启动 / 重启必须通过进程归属核验；远端只连接，不管理进程。</text>
</svg>
